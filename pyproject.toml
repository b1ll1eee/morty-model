[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "morty-model"
version = "0.1.0"
description = "ผู้ช่วย AI ที่รันในเครื่องบน Ollama: โมเดลกลางหนึ่งตัว แตกเป็น expert ด้วย profile"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "ollama>=0.6,<0.7",
  "python-dotenv>=1.0",
  "rich>=13",
  "ruff>=0.5",
  "bandit>=1.7",
]

[project.scripts]
morty = "morty.cli:main"

[tool.setuptools.packages.find]
include = ["morty*"]

[tool.setuptools.package-data]
morty = ["profiles/*.toml"]

[tool.ruff]
line-length = 120
target-version = "py312"
exclude = [".venv", "data", "evals", "logs"]

[tool.ruff.lint]
select = ["E", "F", "W", "B", "I", "UP"]
ignore = ["E501"]  # บรรทัดยาวในข้อความภาษาไทยและ prompt

[tool.ruff.lint.isort]
known-first-party = ["morty"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
